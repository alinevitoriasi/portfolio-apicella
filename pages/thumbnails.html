    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=play_arrow" />
  <link href="../css/variable.css" rel="stylesheet" type="text/css" />
  <link href="../css/responsive.css" rel="stylesheet" type="text/css" />
  <link href="../css/layout.css" rel="stylesheet" type="text/css" />
  <link href="../css/components.css" rel="stylesheet" type="text/css" />
  <link href="../css/sections.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" />
</head>

<body>
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursor-ring"></div>

  <a href="/"><img src="../assets/logo.png" alt="Logo" class="top-left-image"></a>
  <nav>
    <ul class="nav-links">
      <li><a href="/">Portfólio</a></li>
      <li><a href="/pages/long-form.html">Vídeos Longos</a></li>
      <li><a href="/pages/short-form.html">Vídeos Curtos</a></li>
      <li><a href="/pages/thumbnails.html">Thumbnails</a></li>
    </ul>
  </nav>
  <main>

    <section class="portfolio-section" id="portfolio">
      <div class="section-label" data-num="01">Portfólio</div>
      <h2 class="section-title"> <span>Thumbnails</span></h2>

      <div class="thumbnails-grid portfolio-youtube" id="thumbnails-grid"></div>
  </main>

  <!-- VIDEO MODAL -->
  <div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <div class="modal-inner">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()">✕ Fechar</button>

      <img class="modal-iframe thumb-modal" id="modal-iframe" src="" alt="Imagem"   onload="this.classList.add('loaded')" />
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-brand">Yan<span style="color: var(--accent)">.</span>Apicella</div>
    <div class="footer-copy">© 2026 — Todos os direitos reservados</div>
  </footer>

  <script src="../js/script.js"></script>
  <script src="../js/portfolio.js"></script>
